apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: frontend}
spec:
  parentRefs: [{name: lab, namespace: envoy-gateway-system}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: frontend, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: spring-boot}
spec:
  parentRefs: [{name: lab, namespace: envoy-gateway-system}]
  rules:
    - matches: [{path: {type: Exact, value: /test}}]
      backendRefs: [{name: spring-boot, port: 8080}]
