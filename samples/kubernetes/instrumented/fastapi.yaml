apiVersion: apps/v1
kind: Deployment
metadata: {name: fastapi}
spec:
  template:
    spec:
      containers:
        - name: fastapi
          command: [opentelemetry-instrument]
          args: [uvicorn, 'app.main:app', --host, '0.0.0.0', --port, '8000']
          env:
            - {name: OTEL_SERVICE_NAME, value: sample-fastapi}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://alloy-central.observability.svc.cluster.local:4318'}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_METRICS_EXPORTER, value: otlp}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_always_on}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: '30000'}
            - {name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: cumulative}
            - {name: OTEL_PYTHON_LOG_CORRELATION, value: 'true'}
            - {name: OTEL_PYTHON_LOG_AUTO_INSTRUMENTATION, value: 'false'}
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http}
            - {name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS, value: '.*/health'}
