apiVersion: apps/v1
kind: Deployment
metadata: {name: spring-boot}
spec:
  template:
    spec:
      containers:
        - name: spring-boot
          env:
            - {name: JAVA_TOOL_OPTIONS, value: '-XX:MaxRAMPercentage=65 -javaagent:/otel/opentelemetry-javaagent.jar'}
            - {name: OTEL_SERVICE_NAME, value: sample-spring-boot}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://alloy-central.observability.svc.cluster.local:4318'}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_METRICS_EXPORTER, value: otlp}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_TRACES_SAMPLER, value: parentbased_always_on}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: '30000'}
            - {name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, value: cumulative}
            - {name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION, value: explicit_bucket_histogram}
