name: Source checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-tools.txt -r samples/fastapi/requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/steps/*.sh --exclude=SC1090,SC1091,SC2034,SC2154
      - run: python -m pytest -q
        working-directory: samples/fastapi
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci && npm run build
        working-directory: samples/frontend
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: mvn -B -ntp test
        working-directory: samples/spring-boot
