target: all
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
        http: {endpoint: '0.0.0.0:4318'}
storage:
  trace:
    backend: s3
    wal: {path: /data/wal}
    pool: {max_workers: 10, queue_depth: 100}
    s3:
      bucket: tempo-traces
      endpoint: seaweedfs.storage.svc.cluster.local:8333
      region: us-east-1
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true
backend_scheduler:
  local_work_path: /data/scheduler
  provider:
    compaction:
      compaction: {block_retention: 24h}
backend_worker:
  compaction: {block_retention: 24h}
usage_report:
  reporting_enabled: false
